[tools]
# Same version as the CI (.github/workflows/ci.yml).
go = "1.27.3"
goreleaser = "2.19.0"

[tasks.build]
description = "Build the plugin binary"
run = "go build -o packer-plugin-xenorchestra ."

[tasks.generate]
description = "Regenerate config.hcl2spec.go (packer-sdc, pinned with the SDK)"
run = """
go install github.com/hashicorp/packer-plugin-sdk/cmd/packer-sdc@v0.6.13
go generate ./...
"""

[tasks.test]
description = "Run the unit tests"
run = "go test ./..."

[tasks.lint]
description = "Check formatting and run go vet (with and without the integration tag)"
run = """
test -z "$(gofmt -l .)" && echo "gofmt: OK" &&
go vet ./... &&
go vet -tags integration ./...
"""

[tasks."test:integration"]
description = "Build a template on a real Xen Orchestra (reads .env, see .env.example)"
run = """
set -e
if [ ! -f .env ]; then
  echo "missing .env: copy .env.example and fill it" >&2
  exit 1
fi
set -a
. ./.env
set +a
go test -tags integration -count=1 -timeout 30m -v ./builder/...
"""

[tasks."release:snapshot"]
description = "Build the release archives locally into dist/, without publishing"
run = "goreleaser release --snapshot --clean --skip=publish"
